<!doctype html>
<!--
  Proyecto: proyprueba (línea base en main) - Laboratorio 11
  Archivo:  index.html
  Rama de trabajo asignada: feature/estructura-login
  Responsable: Torres Vásquez, Ana Lucía (Tarapoto)
  Nota: no cambiar los id (loginForm, email, password, togglePassword, btnEnviar, message)
        ni las clases (contenedor, fila-password) sin coordinar con el equipo.
  Nota: el formulario lleva novalidate para que la validación la haga script.js
        (si se usa type="email", el navegador no bloqueará el envío antes que el JS).
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="contenedor">
      <h1>Iniciar sesión</h1>
      <p class="ayuda">Ingresa tu correo y contraseña para continuar.</p>

      <form id="loginForm" novalidate>
        <label for="email">Correo</label>
        <input
          type="text"
          id="email"
          placeholder="Correo"
          autocomplete="username"
        />

        <label for="password">Contraseña</label>
        <div class="fila-password">
          <input
            type="password"
            id="password"
            placeholder="Contraseña"
            autocomplete="current-password"
          />
          <button type="button" id="togglePassword">Mostrar</button>
        </div>

        <button type="submit" id="btnEnviar">Entrar</button>
      </form>

      <p id="message" role="status" aria-live="polite"></p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
